name: Update Animated GitHub Stats

on:
  schedule:
    - cron: '0 */12 * * *' # Run every 12 hours
  workflow_dispatch: # Allow manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Generate Animated Stats
        run: |
          node generate-animated-stats.js
          node generate-animated-streak.js
        
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add animated-stats.svg animated-streak.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update animated stats SVG" && git push)
