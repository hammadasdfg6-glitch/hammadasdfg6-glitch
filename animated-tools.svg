      <image x="0" y="0" width="35" height="28" href="data:image/svg+xml;base64," />
      <image x="45" y="0" width="35" height="28" href="data:image/svg+xml;base64," />
      <image x="90" y="0" width="35" height="28" href="data:image/svg+xml;base64," />
      <image x="135" y="0" width="35" height="28" href="data:image/svg+xml;base64," />
      <image x="180" y="0" width="35" height="28" href="data:image/svg+xml;base64," />

    </g>
    <g transform="translate(225, 0)">
      <image x="0" y="0" width="35" height="28" href="data:image/svg+xml;base64," />
      <image x="45" y="0" width="35" height="28" href="data:image/svg+xml;base64," />
      <image x="90" y="0" width="35" height="28" href="data:image/svg+xml;base64," />
      <image x="135" y="0" width="35" height="28" href="data:image/svg+xml;base64," />
      <image x="180" y="0" width="35" height="28" href="data:image/svg+xml;base64," />

    </g>
  </g>
</svg>