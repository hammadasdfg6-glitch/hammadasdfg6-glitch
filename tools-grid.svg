<svg width="900" height="140" viewBox="0 0 900 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171720"/>
      <stop offset="100%" stop-color="#101016"/>
    </linearGradient>

    <linearGradient id="tile-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E2E3E"/>
      <stop offset="100%" stop-color="#1B1B26"/>
    </linearGradient>
  </defs>

  <style>
    .bento-card {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }
    .bento-card:hover {
      transform: translateY(-4px);
    }
    .bento-card:hover .card-box {
      stroke: #FFD700;
      stroke-opacity: 0.7;
    }
    .bento-card:hover .card-title {
      fill: #FFD700;
    }
  </style>

  <!-- 1. Git (x=10, y=12) -->
  <g class="bento-card" transform="translate(10, 12)">
