<svg width="900" height="110" viewBox="0 0 900 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footer-bg" x1="0" y1="0" x2="900" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D0D12"/>
      <stop offset="50%" stop-color="#15151E"/>
      <stop offset="100%" stop-color="#0D0D12"/>
    </linearGradient>

    <linearGradient id="footer-border" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#282836" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#282836" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Consolas', 'Courier New', monospace; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
  </style>

  <!-- Container -->
  <rect x="2" y="4" width="896" height="102" rx="16" fill="url(#footer-bg)" stroke="url(#footer-border)" stroke-width="1.5"/>

  <!-- Left Status Indicator -->
  <rect x="28" y="28" width="180" height="54" rx="10" fill="#181822" stroke="#282836" stroke-width="1"/>
  <circle cx="48" cy="48" r="4.5" fill="#27C93F" class="pulse-dot"/>
  <text x="62" y="52" fill="#FFFFFF" class="font-mono" font-size="11" font-weight="700">STATUS: AVAILABLE</text>
  <text x="44" y="70" fill="#78788A" class="font-mono" font-size="10">Open for Backend Roles</text>

  <!-- Center Callout -->
  <text x="450" y="46" fill="#FFFFFF" class="font-sans" font-size="15.5" font-weight="700" text-anchor="middle">
    Ready to architect scalable backend systems together?
  </text>
  <text x="450" y="68" fill="#9090A2" class="font-sans" font-size="11.5" text-anchor="middle">
    Reach out via <tspan fill="url(#gold-grad)" font-weight="700">hammadasdfg6@gmail.com</tspan> for collaborations &amp; architecture.
  </text>

  <!-- Right Telemetry Signature -->
  <rect x="692" y="28" width="180" height="54" rx="10" fill="#181822" stroke="#282836" stroke-width="1"/>
  <text x="782" y="49" fill="#FFD700" class="font-mono" font-size="11" font-weight="700" text-anchor="middle">⚡ MUHAMMAD HAMMAD</text>
  <text x="782" y="68" fill="#78788A" class="font-mono" font-size="10" text-anchor="middle">ENGINEERED WITH PRECISION</text>
</svg>
