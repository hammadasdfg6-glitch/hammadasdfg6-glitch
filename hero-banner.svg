<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep obsidian gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0A0E"/>
      <stop offset="50%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#0B0B0F"/>
    </linearGradient>

    <!-- Gold & Amber gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#33333E" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#33333E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF9900" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="glow-left" cx="180" cy="140" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-right" cx="730" cy="140" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA500" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFA500" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03"/>
      <circle cx="30" cy="30" r="0.8" fill="#FFD700" fill-opacity="0.12"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Consolas', 'Courier New', monospace; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.35; }
      85% { opacity: 0.35; }
      100% { transform: translateY(250px); opacity: 0; }
    }

    .pulse { animation: pulse-dot 2.2s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
    .stream { stroke-dasharray: 5 5; animation: dash-flow 1.8s linear infinite; }
    .stream-rev { stroke-dasharray: 4 6; animation: dash-flow 2.4s linear infinite reverse; }
    .floating { animation: float-slow 4s ease-in-out infinite; }
    .cursor { animation: blink 1s infinite; }
    .scan { animation: scanline 6s linear infinite; }
  </style>

  <!-- Main Outer Container -->
  <rect x="2" y="2" width="896" height="276" rx="18" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="276" rx="18" fill="url(#grid)"/>
  <rect x="2" y="2" width="896" height="276" rx="18" fill="url(#glow-left)"/>
  <rect x="2" y="2" width="896" height="276" rx="18" fill="url(#glow-right)"/>

  <!-- Subtle Horizontal Scanline -->
  <line x1="10" y1="15" x2="890" y2="15" stroke="url(#gold-grad)" stroke-width="1" stroke-opacity="0.2" class="scan"/>

  <!-- Top Bar / Window Header -->
  <path d="M 2 20 Q 2 2 20 2 L 880 2 Q 898 2 898 20 L 898 42 L 2 42 Z" fill="#16161D" fill-opacity="0.85"/>
  <line x1="2" y1="42" x2="898" y2="42" stroke="#282834" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="22" r="5.5" fill="#FF5F56"/>
  <circle cx="42" cy="22" r="5.5" fill="#FFBD2E"/>
  <circle cx="60" cy="22" r="5.5" fill="#27C93F"/>

  <!-- Terminal Breadcrumb -->
  <text x="84" y="26" fill="#707080" class="font-mono" font-size="11.5" font-weight="600">hammad@production-cluster:~/architecture/core</text>

  <!-- Right Status Pill in Top Bar -->
  <rect x="736" y="11" width="144" height="22" rx="11" fill="#1D1D26" stroke="#FFD700" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="750" cy="22" r="4" fill="#27C93F" class="pulse"/>
  <text x="762" y="26" fill="#E0E0E8" class="font-mono" font-size="10.5" font-weight="600">SYS.ONLINE // 99.9%</text>

  <!-- ==================== LEFT SECTION: IDENTITY & TELEMETRY ==================== -->
  <!-- Role Tag -->
  <rect x="38" y="64" width="248" height="24" rx="6" fill="#FFD700" fill-opacity="0.1" stroke="#FFD700" stroke-opacity="0.35" stroke-width="1"/>
  <text x="50" y="80" fill="#FFD700" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.2">⚡ BACKEND SYSTEMS ENGINEER</text>

  <!-- Main Name Title -->
  <text x="38" y="128" fill="#FFFFFF" class="font-sans" font-size="36" font-weight="800" letter-spacing="-0.5">Muhammad <tspan fill="url(#gold-grad)">Hammad</tspan></text>

  <!-- Subtitle / Mission -->
  <text x="38" y="156" fill="#A0A0B0" class="font-sans" font-size="14.5" font-weight="500">
    Architecting high-throughput APIs, distributed event queues,
  </text>
  <text x="38" y="176" fill="#A0A0B0" class="font-sans" font-size="14.5" font-weight="500">
    and resilient database clusters built for scale.
  </text>

  <!-- Tech Pill Badges -->
  <g transform="translate(38, 196)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="112" height="26" rx="6" fill="#17171F" stroke="#2E2E3A" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#5FA04E"/>
    <text x="25" y="17" fill="#D0D0DC" class="font-mono" font-size="11" font-weight="600">Node.js Core</text>

    <!-- Pill 2 -->
    <rect x="122" y="0" width="128" height="26" rx="6" fill="#17171F" stroke="#2E2E3A" stroke-width="1"/>
    <circle cx="136" cy="13" r="3.5" fill="#336791"/>
    <text x="147" y="17" fill="#D0D0DC" class="font-mono" font-size="11" font-weight="600">SQL &amp; NoSQL</text>

    <!-- Pill 3 -->
    <rect x="260" y="0" width="132" height="26" rx="6" fill="#17171F" stroke="#2E2E3A" stroke-width="1"/>
    <circle cx="274" cy="13" r="3.5" fill="#DC382D"/>
    <text x="285" y="17" fill="#D0D0DC" class="font-mono" font-size="11" font-weight="600">Redis &amp; BullMQ</text>

    <!-- Pill 4 -->
    <rect x="402" y="0" width="116" height="26" rx="6" fill="#17171F" stroke="#2E2E3A" stroke-width="1"/>
    <circle cx="416" cy="13" r="3.5" fill="#E10098"/>
    <text x="427" y="17" fill="#D0D0DC" class="font-mono" font-size="11" font-weight="600">GraphQL / WS</text>
  </g>

  <!-- Live Command Prompt Footer -->
  <text x="38" y="252" fill="#686878" class="font-mono" font-size="12">
    <tspan fill="#FFD700" font-weight="700">➜</tspan> <tspan fill="#5FA04E">~</tspan> systemctl status backend-engine.service <tspan fill="#27C93F">[ACTIVE]</tspan><tspan fill="#FFD700" class="cursor">_</tspan>
  </text>

  <!-- ==================== RIGHT SECTION: LIVE CLUSTER SCHEMATIC ==================== -->
  <g transform="translate(570, 56)">
    <g class="floating">
      <!-- Schematic Backdrop Card -->
      <rect x="0" y="0" width="296" height="196" rx="12" fill="#121218" fill-opacity="0.9" stroke="#262632" stroke-width="1.5"/>
      <text x="16" y="22" fill="#686878" class="font-mono" font-size="10" font-weight="700" letter-spacing="1">LIVE TOPOLOGY // MESH-V2</text>
      <circle cx="276" cy="18" r="3" fill="#FFD700" class="pulse"/>

      <!-- Animated Data Streams (Connecting Lines) -->
      <!-- Gateway to Services -->
      <path d="M 148 64 L 74 104" stroke="#FFD700" stroke-width="1.5" stroke-opacity="0.7" class="stream"/>
      <path d="M 148 64 L 148 104" stroke="#FFD700" stroke-width="1.5" stroke-opacity="0.7" class="stream"/>
      <path d="M 148 64 L 222 104" stroke="#FFD700" stroke-width="1.5" stroke-opacity="0.7" class="stream"/>

      <!-- Services to Data Layer -->
      <path d="M 74 132 L 105 162" stroke="#5FA04E" stroke-width="1.5" stroke-opacity="0.7" class="stream-rev"/>
      <path d="M 148 132 L 105 162" stroke="#336791" stroke-width="1.5" stroke-opacity="0.7" class="stream"/>
      <path d="M 148 132 L 195 162" stroke="#E10098" stroke-width="1.5" stroke-opacity="0.7" class="stream"/>
      <path d="M 222 132 L 195 162" stroke="#DC382D" stroke-width="1.5" stroke-opacity="0.7" class="stream-rev"/>

      <!-- Node 1: API Gateway (Top Center) -->
      <rect x="96" y="36" width="104" height="28" rx="6" fill="#1B1B24" stroke="#FFD700" stroke-width="1.5"/>
      <circle cx="110" cy="50" r="3.5" fill="#FFD700" class="pulse"/>
      <text x="120" y="54" fill="#FFFFFF" class="font-mono" font-size="10.5" font-weight="700">API GATEWAY</text>

      <!-- Node 2: Auth / REST (Middle Left) -->
      <rect x="28" y="104" width="84" height="28" rx="6" fill="#181820" stroke="#5FA04E" stroke-width="1.2"/>
      <text x="70" y="122" fill="#E0E0E8" class="font-mono" font-size="10" font-weight="600" text-anchor="middle">REST / Express</text>

      <!-- Node 3: GraphQL / WS (Middle Center) -->
      <rect x="118" y="104" width="60" height="28" rx="6" fill="#181820" stroke="#E10098" stroke-width="1.2"/>
      <text x="148" y="122" fill="#E0E0E8" class="font-mono" font-size="10" font-weight="600" text-anchor="middle">GraphQL</text>

      <!-- Node 4: BullMQ Worker (Middle Right) -->
      <rect x="184" y="104" width="84" height="28" rx="6" fill="#181820" stroke="#DC382D" stroke-width="1.2"/>
      <text x="226" y="122" fill="#E0E0E8" class="font-mono" font-size="10" font-weight="600" text-anchor="middle">BullMQ / Redis</text>

      <!-- Node 5: Primary DB Cluster (Bottom Left) -->
      <rect x="48" y="156" width="104" height="26" rx="6" fill="#16161E" stroke="#336791" stroke-width="1.2"/>
      <text x="100" y="173" fill="#A8C5E8" class="font-mono" font-size="9.5" font-weight="700" text-anchor="middle">PG / MySQL Pool</text>

      <!-- Node 6: Document Store (Bottom Right) -->
      <rect x="160" y="156" width="92" height="26" rx="6" fill="#16161E" stroke="#47A248" stroke-width="1.2"/>
      <text x="206" y="173" fill="#A8E8B0" class="font-mono" font-size="9.5" font-weight="700" text-anchor="middle">MongoDB Replica</text>
    </g>
  </g>
</svg>
