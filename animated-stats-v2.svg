
      <svg
        width="495"
        height="195"
        viewBox="0 0 495 195"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <style>
          .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #FFD700;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          
    .stat {
      font: 600 14px 'Inter', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #9f9f9f;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    .rank-text {
      font: 800 24px 'Inter', Ubuntu, Sans-Serif; fill: #9f9f9f; 
      animation: scaleInAnimation 0.3s ease-in-out forwards;
    }
    
    .bold { font-weight: 700 }
    .icon {
      fill: #FFD700;
      display: none;
    }
    
    .rank-circle-rim {
      stroke: #FFD700;
      fill: none;
      stroke-width: 6;
      opacity: 0.2;
    }
    .rank-circle {
      stroke: #FFD700;
      stroke-dasharray: 250;
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      opacity: 0.8;
      transform-origin: -10px 8px;
      transform: rotate(-90deg);
      animation: customRankAnimation 5s infinite;
    }
    
    @keyframes rankAnimation {
      from {
        stroke-dashoffset: 251.32741228718345;
      }
      to {
        stroke-dashoffset: 127.42532200850238;
      }
    }
  
  

          
    /* Animations */
    @keyframes scaleInAnimation {
      from {
        transform: translate(-5px, 5px) scale(0);
      }
      to {
        transform: translate(-5px, 5px) scale(1);
      }
    }
    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  
        
.col-0 { animation: spin-0 7.5s infinite; }
@keyframes spin-0 {
                0% { transform: translateY(0); }
                6.666666666666667% { transform: translateY(0); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
                26.666666666666668% { transform: translateY(-176px); }
                100% { transform: translateY(-176px); }
            }
.col-1 { animation: spin-1 7.5s infinite; }
@keyframes spin-1 {
                0% { transform: translateY(0); }
                6.666666666666667% { transform: translateY(0); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
                26.666666666666668% { transform: translateY(-176px); }
                100% { transform: translateY(-176px); }
            }
.col-2 { animation: spin-2 7.5s infinite; }
@keyframes spin-2 {
                0% { transform: translateY(0); }
                9.333333333333332% { transform: translateY(0); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
                29.333333333333332% { transform: translateY(-160px); }
                100% { transform: translateY(-160px); }
            }
.col-3 { animation: spin-3 7.5s infinite; }
@keyframes spin-3 {
                0% { transform: translateY(0); }
                12.000000000000002% { transform: translateY(0); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
                32% { transform: translateY(-192px); }
                100% { transform: translateY(-192px); }
            }
.col-4 { animation: spin-4 7.5s infinite; }
@keyframes spin-4 {
                0% { transform: translateY(0); }
                6.666666666666667% { transform: translateY(0); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
                26.666666666666668% { transform: translateY(-160px); }
                100% { transform: translateY(-160px); }
            }
.col-5 { animation: spin-5 7.5s infinite; }
@keyframes spin-5 {
                0% { transform: translateY(0); }
                6.666666666666667% { transform: translateY(0); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
                26.666666666666668% { transform: translateY(-160px); }
                100% { transform: translateY(-160px); }
            }
.col-6 { animation: spin-6 7.5s infinite; }
@keyframes spin-6 {
                0% { transform: translateY(0); }
                6.666666666666667% { transform: translateY(0); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
                26.666666666666668% { transform: translateY(-160px); }
                100% { transform: translateY(-160px); }
            }

        @keyframes customRankAnimation {
            0% { stroke-dashoffset: 251.327; }
            20% { stroke-dashoffset: 251.327; animation-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275); }
            60% { stroke-dashoffset: 127.42532200850238; }
            100% { stroke-dashoffset: 127.42532200850238; }
        }
        </style>

