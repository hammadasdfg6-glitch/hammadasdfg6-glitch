name: Update Animated GitHub Stats

on:
  schedule:
    - cron: '0 */2 * * *' # Run every 2 hours
  workflow_dispatch: # Allow manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Generate Animated Stats
        run: |
          node generate-animated-stats.js
          node generate-animated-streak.js
          
      - name: Bump Cache Buster in README
        run: |
          node -e "const fs = require('fs'); let readme = fs.readFileSync('README.md', 'utf8'); readme = readme.replace(/animated-stats-v2\.svg\?v=\d+/, 'animated-stats-v2.svg?v=' + Date.now()).replace(/animated-streak-v2\.svg\?v=\d+/, 'animated-streak-v2.svg?v=' + Date.now()); fs.writeFileSync('README.md', readme);"
        
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add animated-stats-v2.svg animated-streak-v2.svg README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update animated stats SVG" && git push)
