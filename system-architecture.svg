<svg width="900" height="230" viewBox="0 0 900 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14141C"/>
      <stop offset="100%" stop-color="#0D0D12"/>
    </linearGradient>

    <linearGradient id="gold-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#282836" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFA500" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="gold-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>

    <pattern id="dot-matrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Consolas', 'Courier New', monospace; }

    @keyframes pulse-bar {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    .bar-anim { animation: pulse-bar 3s infinite ease-in-out; }
  </style>

  <!-- ==================== CARD 1: DEVELOPER TELEMETRY (LEFT) ==================== -->
  <g transform="translate(2, 4)">
    <rect x="0" y="0" width="436" height="220" rx="16" fill="url(#card-bg)" stroke="url(#gold-border)" stroke-width="1.5"/>
    <rect x="0" y="0" width="436" height="220" rx="16" fill="url(#dot-matrix)"/>

    <!-- Card Header -->
    <rect x="0" y="0" width="436" height="38" rx="16" fill="#1A1A24" fill-opacity="0.7"/>
    <line x1="0" y1="38" x2="436" y2="38" stroke="#262634" stroke-width="1"/>
    <circle cx="20" cy="19" r="4" fill="#FFD700"/>
    <text x="34" y="23" fill="#FFFFFF" class="font-mono" font-size="11.5" font-weight="700" letter-spacing="0.8">IDENTITY // PROFILE.JSON</text>
    <text x="355" y="23" fill="#68687A" class="font-mono" font-size="10.5">v2.4.0</text>

    <!-- JSON Code Content -->
    <g transform="translate(24, 62)" class="font-mono" font-size="12.5">
      <text x="0" y="0" fill="#707085">01</text>
      <text x="28" y="0" fill="#FFD700">{</text>

      <text x="0" y="24" fill="#707085">02</text>
      <text x="44" y="24" fill="#9CDCFE">"engineer"</text>
      <text x="122" y="24" fill="#D4D4D4">:</text>
      <text x="134" y="24" fill="#CE9178">"Muhammad Hammad"</text>
      <text x="266" y="24" fill="#D4D4D4">,</text>

      <text x="0" y="48" fill="#707085">03</text>
      <text x="44" y="48" fill="#9CDCFE">"role"</text>
      <text x="92" y="48" fill="#D4D4D4">:</text>
      <text x="104" y="48" fill="#CE9178">"Backend &amp; Systems Architect"</text>
      <text x="328" y="48" fill="#D4D4D4">,</text>

      <text x="0" y="72" fill="#707085">04</text>
      <text x="44" y="72" fill="#9CDCFE">"education"</text>
      <text x="130" y="72" fill="#D4D4D4">:</text>
      <text x="142" y="72" fill="#CE9178">"B.S. Software Engineering"</text>
      <text x="348" y="72" fill="#D4D4D4">,</text>

      <text x="0" y="96" fill="#707085">05</text>
      <text x="44" y="96" fill="#9CDCFE">"focus"</text>
      <text x="98" y="96" fill="#D4D4D4">: [</text>
      <text x="118" y="96" fill="#4EC9B0">"Distributed Systems"</text>
      <text x="278" y="96" fill="#D4D4D4">,</text>
      <text x="290" y="96" fill="#4EC9B0">"DevOps"</text>
      <text x="352" y="96" fill="#D4D4D4">],</text>

      <text x="0" y="120" fill="#707085">06</text>
      <text x="44" y="120" fill="#9CDCFE">"philosophy"</text>
      <text x="138" y="120" fill="#D4D4D4">:</text>
      <text x="150" y="120" fill="#FFD700">"Clean code. Zero bottlenecks."</text>

      <text x="0" y="142" fill="#707085">07</text>
      <text x="28" y="142" fill="#FFD700">}</text>
    </g>
  </g>

  <!-- ==================== CARD 2: ARCHITECTURAL PILLARS (RIGHT) ==================== -->
  <g transform="translate(462, 4)">
    <rect x="0" y="0" width="436" height="220" rx="16" fill="url(#card-bg)" stroke="url(#gold-border)" stroke-width="1.5"/>
    <rect x="0" y="0" width="436" height="220" rx="16" fill="url(#dot-matrix)"/>

    <!-- Card Header -->
    <rect x="0" y="0" width="436" height="38" rx="16" fill="#1A1A24" fill-opacity="0.7"/>
    <line x1="0" y1="38" x2="436" y2="38" stroke="#262634" stroke-width="1"/>
    <circle cx="20" cy="19" r="4" fill="#27C93F"/>
    <text x="34" y="23" fill="#FFFFFF" class="font-mono" font-size="11.5" font-weight="700" letter-spacing="0.8">CORE CAPABILITIES // BENCHMARKS</text>
    <text x="345" y="23" fill="#FFD700" class="font-mono" font-size="10.5" font-weight="700">PRODUCTION</text>

    <!-- Pillar 1 -->
    <g transform="translate(24, 54)">
      <text x="0" y="12" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="700">High-Concurrency API Design</text>
      <text x="388" y="12" fill="#FFD700" class="font-mono" font-size="11" font-weight="700" text-anchor="end">REST / GraphQL</text>
      <rect x="0" y="20" width="388" height="6" rx="3" fill="#22222E"/>
      <rect x="0" y="20" width="365" height="6" rx="3" fill="url(#gold-text)" class="bar-anim"/>
      <text x="0" y="38" fill="#888898" class="font-sans" font-size="11">Schema validation, rate-limiting, Swagger/OpenAPI specs &amp; JWT security</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(24, 108)">
      <text x="0" y="12" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="700">Data Layer &amp; Query Optimization</text>
      <text x="388" y="12" fill="#5FA04E" class="font-mono" font-size="11" font-weight="700" text-anchor="end">ACID &amp; NoSQL</text>
      <rect x="0" y="20" width="388" height="6" rx="3" fill="#22222E"/>
      <rect x="0" y="20" width="350" height="6" rx="3" fill="#5FA04E" class="bar-anim"/>
      <text x="0" y="38" fill="#888898" class="font-sans" font-size="11">Indexing strategies, connection pooling across PostgreSQL, MySQL &amp; MongoDB</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(24, 162)">
      <text x="0" y="12" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="700">Event-Driven &amp; Real-Time Pipelines</text>
      <text x="388" y="12" fill="#E10098" class="font-mono" font-size="11" font-weight="700" text-anchor="end">Async Workers</text>
      <rect x="0" y="20" width="388" height="6" rx="3" fill="#22222E"/>
      <rect x="0" y="20" width="340" height="6" rx="3" fill="#E10098" class="bar-anim"/>
      <text x="0" y="38" fill="#888898" class="font-sans" font-size="11">Job scheduling with BullMQ, Redis caching layers &amp; Socket.io bi-directional streams</text>
    </g>
  </g>
</svg>
